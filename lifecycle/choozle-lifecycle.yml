status_page:
  url: null
  published: false
  note: >-
    No status page. https://status.choozle.com/ and https://trust.choozle.com/
    both resolve through a wildcard to the Choozle application and return the
    login page, not a status or trust surface — this is DNS catch-all behaviour,
    not a published page. No StatusPage pointer is emitted.
  evidence:
    - url: https://status.choozle.com/
      status: 200
      served: false
      reason: wildcard resolves to the app login page
    - url: https://trust.choozle.com/
      status: 200
      served: false
      reason: wildcard resolves to the app login page
sla:
  url: null
  uptime_target: null
  note: >-
    No uptime target or availability commitment is published for the API. The
