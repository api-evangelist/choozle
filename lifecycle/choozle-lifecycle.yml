    platform generally.
staleness:
  api_reference_generator_time: '2015-06-04T16:45:58.265Z'
  api_reference_generator: apidoc 0.13.1
  api_reference_last_modified: '2026-04-06'
  note: >-
    The reference at https://app.choozle.com/apidoc/ is still being redeployed —
    the JSON assets carry a 2026-04-06 Last-Modified — but its embedded
    generator timestamp shows the content was generated in June 2015 and has not
    been regenerated since. The examples in it are dated 2014 and 2015. Choozle
    has since added Amazon DSP, DOOH, Search and Social channels to the platform;
    none of that is reflected in the API surface, which remains the three
    original reporting operations.
  corroboration: >-
    The published apiDoc records the source file as
    ../../../app/Controller/ApiController.php, a single controller — consistent
    with a small reporting-only API rather than a platform API that grew with
    the product.
access_lifecycle:
  key_issuance: >-
    An ORG admin or advertiser admin creates an API profile/username in the
    application; the system generates the API secret key, which is released only
    on a Customer Portal ticket. There is no self-service key page and no
    programmatic key rotation.
  api_only_users: >-
    An API Only user has full access to account data through the API, including
    campaign and ad group reporting data, but cannot view, edit or otherwise
    access the account from the website.
  token_lifetime_seconds: 7200
  token_rotation: re-authenticate; no refresh token
