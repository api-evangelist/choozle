summary: >-
  Choozle publishes an API reference but no lifecycle commitments of any kind —
  no versioning scheme a caller can select, no deprecation policy, no dated
  changelog, no SLA and no status page. The reference itself carries a strong
  staleness signal: the apiDoc generator stamp reads 2015-06-04.
versioning:
  scheme: none-in-transport
  current: null
  selectable: false
  docs: https://app.choozle.com/apidoc/
  note: >-
    No path segment, header or query parameter selects a version. The base URL
    is https://app.choozle.com/api. Version strings exist only as metadata
    inside the published apiDoc dataset — each operation is tagged 1.0.0 and the
    project is 0.1.0 — and neither is addressable by a client.
  evidence:
    - source: https://app.choozle.com/apidoc/api_project.json
      field: version
      value: '0.1.0'
    - source: https://app.choozle.com/apidoc/api_data.json
      field: version (per operation)
      value: '1.0.0'
