aid: choozle
name: Choozle
description: >-
  Choozle is a Denver-based self-service demand-side platform (DSP) for
  programmatic digital advertising across Display, Connected TV, Video, Audio,
  Native, DOOH, Search and Social, with buying routed through The Trade Desk and
  Amazon DSP. Its public developer surface is a single read-only product, the
  Choozle Outbound Reporting API: three operations that exchange an HMAC-SHA256
  signature for a two-hour token, return the account/campaign/ad group tree, and
  return daily per-ad-group performance rows. Campaign, audience, creative and
  deal management are performed in the web application only — no public API
  writes to them. Keys are issued by support ticket rather than self-service.
accessModel:
  pricing: sales-led
  onboarding: sales-led
  trial: false
  try_now: false
  public: false
  label: Customer-only API, keys issued by support ticket
  confidence: high
  source:
  - authentication
  - plans
  - probe
  note: >-
    https://app.choozle.com/users/register returns 404 — there is no public
    self-serve registration. An API secret key is generated when an ORG or
    advertiser admin creates an API profile and is released only via a Customer
    Portal ticket. Published commercial terms are minimum media spends, not a
    subscription price list.
  generated: '2026-08-13'
  method: probed
