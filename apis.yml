- aid: choozle:choozle-authorization-api
  name: Choozle Authorization API
  description: >-
    The token exchange. POST an API profile email, an ISO 8601 timestamp within
    five minutes of server time, and an HMAC-SHA256 hex signature to receive a
    token valid two hours. One operation, the API's only write.
