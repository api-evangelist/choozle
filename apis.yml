- aid: choozle:choozle-reports-api
  name: Choozle Reports API
  description: >-
    Returns one performance row per active ad group per day for an account,
    optionally filtered by date range and by exactly one of campaign, campaign
    status, or ad group ids. Rows are omitted for days with no activity. One
    operation, read-only.
